# FullStack-Logic-AtoZ Docker Compose À
# ãz∞É(nµ¸”πö©

version: '3.8'

services:
  # ===========================================
  # ’ÌÛ»®Û… (Next.js)
  # ===========================================
  frontend:
    container_name: fullstack-frontend
    build:
      context: ./02_implementation/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_AI_SERVICE_URL=http://localhost:8001
    volumes:
      - ./02_implementation/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
      - ai_service
    networks:
      - fullstack-network
    restart: unless-stopped

  # ===========================================
  # –√Ø®Û… (Node.js / Express)
  # ===========================================
  backend:
    container_name: fullstack-backend
    build:
      context: ./02_implementation/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fullstack_db
      - MONGODB_URI=mongodb://mongodb:27017/fullstack_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - JWT_EXPIRES_IN=7d
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./02_implementation/backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - fullstack-network
    restart: unless-stopped

  # ===========================================
  # AIµ¸”π (Python / FastAPI)
  # ===========================================
  ai_service:
    container_name: fullstack-ai-service
    build:
      context: ./02_implementation/ai_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fullstack_db
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./02_implementation/ai_service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fullstack-network
    restart: unless-stopped

  # ===========================================
  # PostgreSQL «¸øŸ¸π
  # ===========================================
  postgres:
    container_name: fullstack-postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fullstack_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fullstack-network
    restart: unless-stopped

  # ===========================================
  # MongoDB «¸øŸ¸π
  # ===========================================
  mongodb:
    container_name: fullstack-mongodb
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=fullstack_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - fullstack-network
    restart: unless-stopped

  # ===========================================
  # Redis ≠„√∑Â
  # ===========================================
  redis:
    container_name: fullstack-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fullstack-network
    restart: unless-stopped

  # ===========================================
  # Adminer (DB°ƒ¸Î) - ãz(
  # ===========================================
  adminer:
    container_name: fullstack-adminer
    image: adminer:4
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - fullstack-network
    restart: unless-stopped
    profiles:
      - dev-tools

  # ===========================================
  # Mailhog (·¸Î∫çƒ¸Î) - ãz(
  # ===========================================
  mailhog:
    container_name: fullstack-mailhog
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - fullstack-network
    restart: unless-stopped
    profiles:
      - dev-tools

# ===========================================
# ‹ÍÂ¸‡ö©
# ===========================================
volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local

# ===========================================
# Õ√»Ô¸Øö©
# ===========================================
networks:
  fullstack-network:
    driver: bridge
